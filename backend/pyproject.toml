[project]
name = "reachstack-backend"
version = "0.1.0"
description = "ReachStack backend service. Phase 0 scaffold: stub endpoints over fixture data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "tzdata>=2024.1",  # IANA timezone DB. Required on Windows where zoneinfo has no source.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
